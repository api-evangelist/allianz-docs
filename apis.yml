    name: Allianz Partners API
    tags:
      - Insurance
      - Assistance
      - Policy Management
    properties:
      - url: https://developer.allianz-assistance.ca/
        type: Portal
      - url: https://developer.allianz-assistance.ca/get-started
        type: GettingStarted
    description: >-
      The Allianz Partners API Management portal provides insurance and assistance product APIs covering the full
      customer journey. APIs support policy purchase, change, and cancellation operations in XML and JSON formats.
      Access requires contractual partnership agreement with Allianz.
    humanURL: https://developer.allianz-assistance.ca/
    baseURL: https://api.allianz-assistance.ca
