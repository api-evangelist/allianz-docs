    description: >-
      The Allianz Global API Portal provides enterprise insurance APIs for registered business partners. The portal uses
      Apigee Edge for API key management and OAuth2 for authentication. Most API documentation is restricted to
      contractual partners.
    humanURL: https://global.apis.allianz.com/api-catalog
    baseURL: https://apis.allianz.com
