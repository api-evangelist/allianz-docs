  - type: Features
    data:
      - name: Insurance Quoting
        description: >-
          APIs for generating price estimates and quotes for home, auto, and other insurance products enabling
          partner-embedded quoting flows.
      - name: Policy Management
        description: >-
          Purchase, change, and cancel insurance policies programmatically through REST and SOAP-compatible API
          interfaces.
      - name: Claims Integration
        description: Retrieve and manage insurance claims data, enabling ERP and enterprise system integration for claims tracking.
      - name: Partner Distribution
        description: >-
          Enable distributors, brokers, and financial institutions to embed Allianz insurance products into their
          customer journeys.
      - name: OAuth2 Authentication
        description: Secure API authentication using OAuth2 client credentials flow for programmatic access to partner APIs.
      - name: Multi-Format Support
        description: APIs support both XML and JSON formats with content negotiation for flexible enterprise integration.
  - type: UseCases
    data:
      - name: Embedded Insurance
        description: >-
          Financial institutions and retailers embedding Allianz insurance offers at the point of sale within their own
          customer journey.
      - name: ERP Integration
        description: >-
          Enterprise companies integrating Allianz trade credit and policy management directly into their ERP systems
          for automation.
      - name: Broker Portals
        description: >-
          Insurance brokers building digital platforms that access Allianz products to offer customers real-time quotes
          and policy management.
      - name: Claims Automation
        description: >-
          Automating claims reporting, status tracking, and management through API integration with enterprise workflow
          systems.
  - type: Integrations
    data:
      - name: Postman
        description: Allianz Trade APIs support Postman collection import for API exploration and testing.
      - name: Apigee Edge
        description: Allianz Global API platform uses Apigee Edge for API key and credential management.
      - name: Azure API Management
        description: Allianz Partners portal is built on Azure API Management platform.
  - url: https://www.allianz.com/en/press.html
    type: Blog
